<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1F6E43">
<meta name="app-version" content="17n">
<link rel="manifest" href="manifest.webmanifest">
<title>Mission Hills Skins</title>
<meta name="description" content="Team skins scorer for the Mission Hills 2026 trip — Stableford, snake, LD, CP, birdies, eagles, ferrets. Works offline.">
<style>
:root{
  color-scheme:light dark;
  --bg:#F4F5F2; --surface:#FFFFFF; --surface-2:#E9ECE6; --text:#17201B; --muted:#5E6B63; --line:#D6DCD4;
  --green:#1F6E43; --green-bg:#E2F0E7; --amber:#B7791F; --amber-bg:#FBF0DA; --red:#B7362B; --red-bg:#F8E3E0; --blue:#2B5FA8; --blue-bg:#E1EAF8;
  --ink:#FFFFFF;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#101613; --surface:#182019; --surface-2:#212B23; --text:#EDF1EC; --muted:#94A199; --line:#2C3830;
  --green:#4CAF77; --green-bg:#173225; --amber:#E0A43C; --amber-bg:#3A2D12; --red:#E06A5C; --red-bg:#3D1F1B; --blue:#7FA6E8; --blue-bg:#1B2B44; --ink:#101613; } }
:root[data-theme="dark"]{
  --bg:#101613; --surface:#182019; --surface-2:#212B23; --text:#EDF1EC; --muted:#94A199; --line:#2C3830;
  --green:#4CAF77; --green-bg:#173225; --amber:#E0A43C; --amber-bg:#3A2D12; --red:#E06A5C; --red-bg:#3D1F1B; --blue:#7FA6E8; --blue-bg:#1B2B44; --ink:#101613; }
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  padding-inline:0;padding-block:0;display:flex;flex-direction:column;min-height:100%}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* shell */
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:17px;font-weight:800;letter-spacing:-.01em}
.top .ctx{font-size:12px;color:var(--muted);text-align:right;line-height:1.25}
main{flex:1;padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px));max-width:720px;width:100%;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;background:none;border:0;border-radius:8px;padding:8px 2px 6px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button[aria-selected="true"]{color:var(--green);background:var(--green-bg)}
nav.tabs button:focus-visible,.btn:focus-visible,.chip:focus-visible,.step button:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* pieces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;min-width:0}
.card h2{font-size:18px;font-weight:800;margin-bottom:8px}
.card h3{font-size:14px;font-weight:700;margin:12px 0 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.banner{border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.banner.info{background:var(--blue-bg);color:var(--text)}
.banner.warn{background:var(--amber-bg)}
.banner.bad{background:var(--red-bg)}
.banner.good{background:var(--green-bg)}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px;min-height:44px}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--ink)}
.btn.danger{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.btn.sm{padding:6px 10px;min-height:36px;font-size:13px}
.btn.block{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:34px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--ink)}
.chip.amber[aria-pressed="true"]{background:var(--amber);border-color:var(--amber)}
.chip.blue[aria-pressed="true"]{background:var(--blue);border-color:var(--blue)}
.chip.done{border-color:var(--green)}
.chip.sm{padding:4px 9px;font-size:12px;min-height:28px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;vertical-align:middle}
.pill.green{background:var(--green-bg);color:var(--green)}.pill.amber{background:var(--amber-bg);color:var(--amber)}.pill.red{background:var(--red-bg);color:var(--red)}.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.grey{background:var(--surface-2);color:var(--muted)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:8px 0 3px}
input.f,select.f{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;min-height:42px}
input.f.sm{padding:6px 8px;min-height:36px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.frac{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
.big{font-size:28px;font-weight:800;line-height:1}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* score */
.holehdr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.holehdr .hn{font-size:38px;font-weight:900;line-height:1;letter-spacing:-.02em}
.holehdr .hm{font-size:13px;color:var(--muted)}
.values{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.value{border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700}
.value.hole{background:var(--green-bg);color:var(--green)}.value.snake{background:var(--amber-bg);color:var(--amber)}.value.ldcp{background:var(--blue-bg);color:var(--blue)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow .who{min-width:0}
.prow .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.prow .sub{font-size:12px;color:var(--muted)}
.prow .dots{color:var(--green);letter-spacing:1px;font-size:11px}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2)}
.step button{width:46px;height:46px;border:0;background:transparent;font-size:22px;font-weight:700}
.step .v{width:46px;text-align:center;font-family:var(--mono);font-size:20px;font-weight:700;background:var(--surface)}
.step .v.pk{color:var(--red);font-size:14px}
.pts{width:52px;text-align:center}
.pts .n{font-family:var(--mono);font-size:22px;font-weight:800;line-height:1}
.pts .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pts.best .n{color:var(--green)}
.pts .rt{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px;white-space:nowrap}
.ptsline{display:flex;gap:4px 14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.ptsline b{color:var(--text);font-family:var(--mono);font-size:14px}
.gridtbl .cpts{font-size:11px;font-weight:800;color:var(--green);margin-top:2px;min-height:13px;font-family:var(--mono)}
.gridtbl .cpts .dots{color:var(--muted);font-size:9px;letter-spacing:1px}
.gridtbl tr.tot td{border-top:2px solid var(--line);font-weight:800;padding-top:8px}
.gridtbl tr.tot .cpts{color:var(--muted);font-weight:600}
.teamsum{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
.teamsum .t{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.teamsum .t.r{text-align:right}
.teamsum .s{font-family:var(--mono);font-size:22px;font-weight:800}
.evrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.evrow .lbl{width:64px;font-size:13px;font-weight:700}
.evrow .lbl small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.holenav{display:flex;gap:8px;margin-top:12px}
.holenav .btn{flex:1}
.holechips{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:10px}
.holechips button{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 0;font-size:12px;font-weight:700;min-height:32px}
.holechips button.done{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.holechips button.cur{background:var(--green);border-color:var(--green);color:var(--ink)}
.holechips button.part{background:var(--amber-bg);border-color:var(--amber);color:var(--amber)}
.autobadge{font-size:11px;font-weight:800;padding:1px 6px;border-radius:5px;margin-left:6px;vertical-align:middle}
.autobadge.b{background:var(--green-bg);color:var(--green)}.autobadge.e{background:var(--amber-bg);color:var(--amber)}
.gridtbl td,.gridtbl th{padding:4px 3px;text-align:center}
.gridtbl input{width:44px;text-align:center;padding:6px 2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--mono);font-size:15px;min-height:38px}
.gridtbl select{max-width:64px;padding:4px 2px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12px;min-height:38px}
.gridtbl td:first-child{font-weight:700;text-align:left}
.gridtbl .ldcp{font-size:9px;color:var(--blue);display:block;font-weight:700}

/* draw */
.draw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.draw{grid-template-columns:1fr}}
.dgroup{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2)}
.dpair{display:flex;gap:6px;align-items:center}
.dlbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:44px}
.dslot{flex:1;min-height:44px;border:1px dashed var(--line);border-radius:8px;background:var(--surface);font-weight:700;font-size:15px;padding:8px 6px;color:var(--muted)}
.dslot.filled{border-style:solid;border-color:var(--green);background:var(--green-bg);color:var(--green)}
/* board */
.stand td.nm{font-weight:700;text-align:left}
td.nm{text-align:left}
.ctr th:not(:first-child),.ctr td:not(:first-child){text-align:center}
.ctr th.nm,.ctr td.nm{text-align:left}
.stand td.tot{font-family:var(--mono);font-weight:800;font-size:17px}
.stand tr.first td.tot{color:var(--green)}
.stand td.r{font-family:var(--mono);font-size:13px;color:var(--muted)}
.daycard .dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.evlist{list-style:none;margin:6px 0 0;padding:0;font-size:13px}
.evlist li{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px dashed var(--line)}
.evlist li span:last-child{font-family:var(--mono);font-weight:700}
details summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0}
.qr{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:12px;margin:10px 0}
.qr img,.qr canvas{max-width:100%;height:auto}
textarea.f{width:100%;min-height:80px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);color:var(--text)}
.rules p{margin:6px 0 10px;font-size:15px}
.rules li{margin-bottom:6px}
.switch{display:flex;align-items:center;gap:10px;font-weight:700}
.switch input{width:22px;height:22px}
.scan{position:fixed;inset:0;background:#000;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.scan-in{width:100%;max-width:480px}
.scan video{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:#111}
.scan-msg{color:#fff;text-align:center;margin:12px 0;font-weight:600}
.scan .btn{background:#fff;color:#111;border-color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:9;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top"><h1 id="appname">Mission Hills Skins</h1><div class="ctx" id="ctx"></div></header>
<main id="main"></main>
<nav class="tabs" id="tabs" role="tablist">
  <button role="tab" data-tab="board"><span class="ic">🏆</span>Board</button>
  <button role="tab" data-tab="score"><span class="ic">✍️</span>Score</button>
  <button role="tab" data-tab="handin"><span class="ic">📤</span>Hand in</button>
  <button role="tab" data-tab="commish"><span class="ic">🎩</span>Commish</button>
  <button role="tab" data-tab="rules"><span class="ic">📜</span>Rules</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script src="courses.js"></script>
<script src="engine.js"></script>
<script src="qrcode.min.js"></script>
<script src="jsqr.min.js"></script>
<script>
(function(){
'use strict';
var E = window.SKINS, COURSES = window.COURSES;
var KEY = 'mhs-state-v1';
var APP_VERSION = (document.querySelector('meta[name="app-version"]')||{}).content || '?';
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var CATS = ['hole','snake','ld','cp'];
var CATN = { hole:'Hole skins', snake:'Snake', ld:'Longest drive', cp:'Closest to pin' };

/* ---------- skins formatting: halves and quarters are real ---------- */
function frac(n){
  if (n===null||n===undefined||isNaN(n)) return '–';
  var neg = n<0; n = Math.abs(n); var w = Math.floor(n+1e-9), r = n - w;
  var f = Math.abs(r-0.5)<1e-6?'½':Math.abs(r-0.25)<1e-6?'¼':Math.abs(r-0.75)<1e-6?'¾':(r<1e-6?'':null);
  var s = f===null ? (Math.round(n*100)/100).toString() : ((w||!f)?w:'')+f;
  return (neg?'−':'')+s;
}
function fmtDate(iso){ if(!iso) return ''; var d=new Date(iso+'T00:00:00'); return d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); },1800); }

/* ---------- example data (seeded, stable) ---------- */
function rng(seed){ var s=seed>>>0; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function exampleTournament(){
  var players = [
    {id:'danny', name:'Danny Cape', short:'Danny'}, {id:'lachlan', name:'Lachlan Symes', short:'Lachlan'},
    {id:'micks', name:'Michael Symes', short:'Mick S'}, {id:'elliot', name:'Elliot', short:'Elliot'},
    {id:'dale', name:'Dale', short:'Dale'}, {id:'zac', name:'Zac', short:'Zac'},
    {id:'poss', name:'Michael Posavac', short:'Poss'}, {id:'slim', name:'Slim', short:'Slim'} ];
  var idx = { danny:12.4, lachlan:14.3, micks:18.0, elliot:9.7, dale:22.5, zac:16.1, poss:11.2, slim:20.8 };  // EXAMPLE numbers
  var rounds = [
    { n:1, date:'2026-11-29', course:'Annika',   tee:'Blue', teeTime:'10:00' },
    { n:2, date:'2026-11-30', course:'Ozaki',    tee:'Blue', teeTime:'08:00' },
    { n:3, date:'2026-12-01', course:'Olazabal', tee:'Blue', teeTime:'08:56' },
    { n:4, date:'2026-12-03', course:'Vijay',    tee:'Blue', teeTime:'09:52' },
    { n:5, date:'2026-12-04', course:'Norman',   tee:'Blue', teeTime:'08:00' } ];
  rounds.forEach(function(r){ r.index = Object.assign({}, idx); r.hcOverride = {}; r.groups = [{id:'A', teams:[[],[]], holes:{}}, {id:'B', teams:[[],[]], holes:{}}]; r.locked=false; });
  // a rotation where no two players are paired twice across the week
  rounds[0].groups[0].teams = [['danny','lachlan'],['micks','elliot']]; rounds[0].groups[1].teams = [['dale','zac'],['poss','slim']];
  rounds[1].groups[0].teams = [['danny','micks'],['dale','poss']];      rounds[1].groups[1].teams = [['lachlan','zac'],['elliot','slim']];
  rounds[2].groups[0].teams = [['danny','zac'],['lachlan','poss']];     rounds[2].groups[1].teams = [['micks','slim'],['elliot','dale']];
  rounds[3].groups[0].teams = [['danny','poss'],['lachlan','elliot']];  rounds[3].groups[1].teams = [['micks','dale'],['zac','slim']];
  var T = { name:'Mission Hills 2026', example:true, entry:150, prizes:[1050,150], players:players, courses:COURSES, rules:{}, rounds:rounds };
  // three full rounds played and locked; round 4 drawn for tomorrow; round 5 not yet drawn
  var R = rng(20261129);
  function scoreGroup(round, g, upTo){
    var course = COURSES[round.course], tee = course.tees.filter(function(t){return t.name===round.tee;})[0];
    var hc = {}; [].concat.apply([],g.teams).forEach(function(p){ hc[p] = E.playingHandicap(round.index[p], tee.slope, tee.rating, course.par); });
    var sp = E.specialHoles(course, round.tee);
    for (var h=1; h<=upTo; h++){
      var H = course.holes[h-1], e = {gross:{}}, all=[].concat.apply([],g.teams);
      all.forEach(function(p){ var s=E.strokesOnHole(hc[p],H.si); var r=R(); var d = r<0.06?-1: r<0.40?0: r<0.75?1: r<0.92?2:3; var gross=H.par+s+d-(s>1?1:0); if (R()<0.02) gross='P'; e.gross[p]=gross; });
      if (R()<0.14){ var c=all.filter(function(p){return e.gross[p]!=='P';}); if(c.length) e.snake=c[Math.floor(R()*c.length)]; }
      if (sp.ld.indexOf(h)>=0 && R()<0.8) e.ld = all[Math.floor(R()*all.length)];
      if (sp.cp.indexOf(h)>=0 && R()<0.7) e.cp = all[Math.floor(R()*all.length)];
      if (h===11 && g.id==='A' && round.n===1) e.ferret = all[1];
      if (h===7 && g.id==='B' && round.n===3) e.ferret = all[2];
      g.holes[h]=e;
    }
  }
  [0,1,2].forEach(function(ri){ scoreGroup(rounds[ri], rounds[ri].groups[0], 18); scoreGroup(rounds[ri], rounds[ri].groups[1], 18); rounds[ri].locked = true; });
  return T;
}
// A clean tournament: real players, courses, dates and tee times — no scores, no handicaps, no draw. What a fresh install starts with.
function emptyTournament(){ var T = exampleTournament(); T.example=false; T.rounds.forEach(function(r){ r.locked=false; r.index={}; r.hcOverride={}; r.groups.forEach(function(g){ g.holes={}; g.teams=[[],[]]; delete g.carriedOverride; delete g.handedIn; }); }); return T; }
function isFresh(T_){ return !T_.example && T_.rounds.every(function(r){ return r.groups.every(function(g){ return !g.teams.some(function(t){ return t.length; }) && !Object.keys(g.holes||{}).length; }); }); }

/* ---------- state ---------- */
var S = { T:null, ui:{ tab:'board', r:0, g:0, hole:1, mode:'live', commish:false, open:{} }, ro:false, incoming:null };
function load(){ try { var raw=localStorage.getItem(KEY); if(raw){ var o=JSON.parse(raw); if(o&&o.T&&o.T.rounds){ S.T=o.T; S.ui=Object.assign(S.ui,o.ui||{}); S.T.courses = S.T.courses||COURSES; return; } } } catch(e){} S.T = exampleTournament(); }
function save(){ if (S.ro) return; try { localStorage.setItem(KEY, JSON.stringify({T:S.T, ui:S.ui})); } catch(e){ toast('Could not save — storage blocked'); } }
function T(){ return S.T; } function R(){ return T().rounds[S.ui.r]; } function G(){ var r=R(); return r&&r.groups[S.ui.g]; }
function pl(id){ return T().players.filter(function(p){return p.id===id;})[0] || {id:id,name:id,short:id}; }
function pname(id){ return pl(id).short||pl(id).name; }
function calc(){ return E.computeTournament(T()); }
function courseOf(r){ return T().courses[r.course]; }
function teeOf(r){ var c=courseOf(r); return (c&&c.tees.filter(function(t){return t.name===r.tee;})[0])||{}; }
function pickRound(){ // today's round, else first not locked, else last
  var d=today(), rs=T().rounds; for(var i=0;i<rs.length;i++) if(rs[i].date===d) return i;
  for(var j=0;j<rs.length;j++) if(!rs[j].locked) return j; return rs.length-1; }
function isCommish(){ return !S.ro && S.ui.commish; }
function canEdit(r){ return !S.ro && (isCommish() || !r.locked); }

/* ---------- mutations ---------- */
function ensureHole(g,h){ g.holes[h]=g.holes[h]||{gross:{}}; g.holes[h].gross=g.holes[h].gross||{}; return g.holes[h]; }
function setGross(h,pid,val){ var r=R(),g=G(); if(!canEdit(r)) return; var e=ensureHole(g,h); if(val===null) delete e.gross[pid]; else e.gross[pid]=val; save(); render(); }
function bump(h,pid,d){ var g=G(); var e=ensureHole(g,h); var cur=e.gross[pid]; var course=courseOf(R()); var par=course.holes[h-1].par;
  var v = (typeof cur==='number') ? cur+d : (cur==='P' ? par : par+(d>0?0:-1)) ; if(cur===undefined&&d>0) v=par; if(v<1) v=1; if(v>15) v=15; setGross(h,pid,v); }
function togglePickup(h,pid){ var g=G(); var e=ensureHole(g,h); setGross(h,pid, e.gross[pid]==='P'?null:'P'); }
function setEvent(h,key,pid){ var r=R(),g=G(); if(!canEdit(r)) return; var e=ensureHole(g,h); if(e[key]===pid||pid===null) delete e[key]; else e[key]=pid; save(); render(); }

/* ---------- views ---------- */
function render(){
  var tab = S.ui.tab;
  Array.prototype.forEach.call($('tabs').children, function(b){ b.setAttribute('aria-selected', String(b.dataset.tab===tab)); });
  var C = calc(); var r=R();
  $('appname').textContent = T().name || 'Mission Hills Skins';
  $('ctx').innerHTML = r ? 'R'+r.n+' · '+esc(r.course)+'<br>'+esc(fmtDate(r.date))+(r.teeTime?' · '+esc(r.teeTime):'') : '';
  var html = '';
  if (S.incoming) html += incomingHtml();
  if (S.ro) html += '<div class="banner info"><b>'+(S.roSetup?'Setup from the commissioner':'Read-only standings')+'</b>'+(S.roAt?' · '+esc(S.roAt):'')+'. '+(S.roSetup?'Load it and you\'re ready to score.':'')+'<div class="btnrow"><button class="btn primary sm" data-act="ro-load">Load into my app</button><button class="btn sm" data-act="ro-dismiss">Just look</button></div></div>';
  else if (T().example) html += '<div class="banner warn"><b>Example data</b> — three made-up rounds so you can see how the week looks. The commissioner wipes it before Sunday (Commish → Data → “Start the real thing”).</div>';
  else if (isFresh(T()) && !S.incoming) html += '<div class="banner info"><b>Ready for the trip.</b> Nothing scored yet. <b>Scorers:</b> get tonight\'s setup from the commissioner — <b>Hand in → Scan a QR</b>. <b>Commissioner:</b> Commish → switch on → PIN, handicaps, draw.</div>';
  if (S.ro && (tab==='handin'||tab==='commish')) html += '<div class="card"><h2>'+(tab==='handin'?'Hand in':'Commissioner')+'</h2><p class="muted" style="margin:0">You\'re looking at a snapshot someone shared, not your own copy. Tap <b>Load into my app</b> above to make it yours, or <b>Just look</b> to go back to your own copy — then this tab works as normal.</p></div>';
  else html += tab==='board'?boardHtml(C): tab==='score'?scoreHtml(C): tab==='handin'?handinHtml(C): tab==='commish'?commishHtml(C): rulesHtml();
  $('main').innerHTML = html;
  if (tab==='handin' && !S.ro) drawQR();
  if (tab==='commish' && S.ui.shareQR) drawShareQR();
}

/* ----- Board ----- */
function boardHtml(C){
  var T_=T(), rs=C.rounds, h='';
  h += '<div class="card stand"><div class="row"><h2>Trophy race</h2><span class="muted" style="font-size:13px">1st $'+esc(T_.prizes[0])+' · 2nd $'+esc(T_.prizes[1])+' · entry $'+esc(T_.entry)+'</span></div>';
  h += '<div class="tbl"><table><thead><tr><th>#</th><th style="text-align:left">Player</th>'+rs.map(function(r){return '<th>R'+r.n+'</th>';}).join('')+'<th>Skins</th></tr></thead><tbody>';
  var prev=null, rank=0;
  C.standings.forEach(function(s,i){ if(s.total!==prev){ rank=i+1; prev=s.total; }
    h += '<tr class="'+(i===0&&s.total>0?'first':'')+'"><td class="num muted">'+rank+'</td><td class="nm">'+esc(s.name)+'</td>'+s.byRound.map(function(v,ri){ var rr=rs[ri]; return '<td class="r">'+(v===null?'·':frac(v))+(rr&&!rr.complete&&v!==null?'<span class="muted">*</span>':'')+'</td>'; }).join('')+'<td class="tot">'+frac(s.total)+'</td></tr>'; });
  h += '</tbody></table></div><div class="muted" style="font-size:12px;margin-top:6px">* round in progress — provisional. Ties on the trophy: to be decided.</div></div>';
  var live = rs.filter(function(r){ return !r.complete; })[0];
  var cn = live ? live.carriedIn : C.carryNext, cnTitle = live ? 'Carried into Round '+live.n : 'Unwon after the final round';
  if (cn && CATS.some(function(k){return cn[k]>0;})) h += '<div class="card"><h2>'+cnTitle+'</h2><div class="chips">'+CATS.map(function(k){ return '<span class="chip sm">'+CATN[k]+' <b class="num">'+frac(cn[k])+'</b></span>'; }).join('')+'</div><div class="muted" style="font-size:12px;margin-top:6px">'+(live?'Split evenly between the groups; each share sits on the first hole of its kind and rolls until won.':'Left over after round 5 — to be decided.')+'</div></div>';
  rs.forEach(function(r,ri){ h += dayCard(C,r,ri); });
  return h;
}
function dayCard(C,r,ri){
  var R_=T().rounds[ri], status = r.locked?'<span class="pill green">Final</span>': r.complete?'<span class="pill amber">Complete · not locked</span>': r.groups.some(function(g){return g.lastPlayed>0;})?'<span class="pill red">Live</span>':'<span class="pill grey">Upcoming</span>';
  var h = '<div class="card daycard"><div class="dh"><div><h2>Round '+r.n+' · '+esc(r.course)+'</h2><div class="muted" style="font-size:13px">'+esc(fmtDate(r.date))+(R_.teeTime?' · tee '+esc(R_.teeTime):'')+' · '+esc(r.tee)+' tees'+(r.slope?' · slope '+r.slope:'')+'</div></div>'+status+'</div>';
  var drawn = r.groups.some(function(g){ return g.teams.some(function(t){return t.length;}); });
  if (!drawn) return h+'<div class="muted" style="margin-top:8px">Draw not set yet.</div></div>';
  if (r.frozen) h += '<div class="muted" style="font-size:12px;margin-top:6px">Summary only on this phone — the full card is on the commissioner\'s standings link.</div>';
  r.groups.forEach(function(g){
    h += '<h3>Group '+esc(g.id)+' <span class="muted" style="font-weight:400">· '+(g.complete?'18 holes':g.lastPlayed?'through hole '+g.lastPlayed:'not started')+'</span></h3>';
    var ci = g.carried || {hole:0,snake:0,ld:0,cp:0};
    h += '<div class="muted" style="font-size:12px;margin:-2px 0 6px">Carried in: '+CATS.map(function(k){return CATN[k]+' '+frac(ci[k]||0);}).join(' · ')+'</div>';
    h += '<div class="teamsum">'+g.teams.map(function(t,i){ return '<div class="t'+(i?' r':'')+'">'+t.map(pname).map(esc).join(' &amp; ')+'<br>'+(g.lastPlayed?'<span class="s">'+frac(g.teamSkins[i])+'</span> <span class="muted" style="font-size:12px">→ '+frac(g.teamSkins[i]/(t.length||1))+' each</span>':'<span class="muted" style="font-size:12px">—</span>')+'</div>'+(i===0?'<div class="muted">v</div>':''); }).join('')+'</div>';
    if (g.events.length) h += '<details><summary>'+g.events.length+' skins events</summary><ul class="evlist">'+g.events.map(function(e){ return '<li><span>H'+e.hole+' · '+evName(e)+'</span><span>'+frac(e.value)+' → '+esc(g.teams[e.team].map(pname).join(' & '))+'</span></li>'; }).join('')+'</ul></details>';
    if (g.complete) h += '<div class="muted" style="font-size:12px;margin-top:4px">Unwon: '+CATS.map(function(k){return CATN[k]+' '+frac(g.unwon[k]);}).join(' · ')+'</div>';
  });
  if (r.ladder){ var ids=Object.keys(r.ladder).sort(function(a,b){return r.ladder[a].place-r.ladder[b].place;});
    h += '<h3>Stableford ladder</h3><div class="tbl"><table class="ctr"><thead><tr><th>#</th><th class="nm">Player</th><th>Pts</th><th>Skins</th></tr></thead><tbody>'+ids.map(function(id){ var l=r.ladder[id]; return '<tr><td class="num muted">'+l.place+(l.tied?'=':'')+'</td><td class="nm">'+esc(pname(id))+'</td><td class="num">'+l.pts+'</td><td class="frac">'+frac(l.skins)+'</td></tr>'; }).join('')+'</tbody></table></div>';
    h += '<h3>Day totals</h3><div class="muted" style="font-size:12px;margin:-4px 0 6px">Team = your half of what your pair won on the course · Personal contribution = the skins you personally won for the pair · S-PTS Skins = your Stableford ladder skins · Day total = Team + S-PTS, which is what goes on the trophy race.</div><div class="tbl"><table class="ctr"><thead><tr><th class="nm">Player</th><th>Team</th><th>Personal contribution</th><th>S-PTS Skins</th><th>Day total</th></tr></thead><tbody>'+T().players.filter(function(p){return r.perPlayer[p.id].played;}).sort(function(a,b){return r.perPlayer[b.id].total-r.perPlayer[a.id].total;}).map(function(p){ var x=r.perPlayer[p.id]; return '<tr><td class="nm">'+esc(p.short||p.name)+'</td><td class="frac">'+frac(x.team)+'</td><td class="frac" style="font-weight:500">'+frac(x.contrib||0)+'</td><td class="frac">'+frac(x.ladder)+'</td><td class="frac">'+frac(x.total)+'</td></tr>'; }).join('')+'</tbody></table></div>';
  } else if (r.groups.some(function(g){return g.lastPlayed>0;})) h += '<div class="muted" style="font-size:12px;margin-top:8px">Ladder is worked out once both groups have 18 holes in.</div>';
  return h+'</div>';
}
function evName(e){ var n = {hole:'Hole skin',snake:'Snake',birdie:'Birdie',eagle:'Eagle',ace:'Hole in one!',ferret:'Ferret',ld:'Longest drive',cp:'Closest to pin'}[e.type]||e.type; return n+(e.player?' — '+esc(pname(e.player)):''); }

/* ----- Score ----- */
function scoreHtml(C){
  var r=R(), g=G(), rs=T().rounds;
  var h = '<div class="card"><div class="chips">'+rs.map(function(x,i){ return '<button class="chip'+(x.locked?' done':'')+'" aria-pressed="'+(i===S.ui.r)+'" data-act="round" data-i="'+i+'">R'+x.n+' '+esc(x.course)+'</button>'; }).join('')+'</div>';
  h += '<div class="chips" style="margin-top:8px">'+r.groups.map(function(x,i){ return '<button class="chip" aria-pressed="'+(i===S.ui.g)+'" data-act="group" data-i="'+i+'">Group '+esc(x.id)+'</button>'; }).join('')+'<span style="flex:1"></span><button class="chip" aria-pressed="'+(S.ui.mode==='grid')+'" data-act="mode">'+(S.ui.mode==='grid'?'Grid view':'Hole by hole')+'</button></div></div>';
  var drawn = g.teams.every(function(t){return t.length>0;});
  if (!drawn) return h+'<div class="card"><h2>Draw not set</h2><p class="muted">The commissioner sets the teams for this round (Commish → Draw).</p></div>';
  var cr = C.rounds[S.ui.r], cg = cr.groups[S.ui.g], course=courseOf(r), all=[].concat.apply([],g.teams);
  if (cr.frozen) return h+'<div class="banner good">Round '+r.n+' is <b>final</b>. This phone holds the summary only — team skins '+cg.teamSkins.map(frac).join(' v ')+'. The full card is on the commissioner\'s standings link.</div>';
  if (r.locked && !isCommish()) h += '<div class="banner good">Round '+r.n+' is <b>locked</b> by the commissioner — read only.</div>';
  h += '<div class="card">';
  h += '<div class="teamsum">'+g.teams.map(function(t,i){ return '<div class="t'+(i?' r':'')+'">'+t.map(pname).map(esc).join(' &amp; ')+'<br><span class="s">'+frac(cg.teamSkins[i])+'</span></div>'+(i===0?'<div class="muted">v</div>':''); }).join('')+'</div>';
  h += '<div class="muted" style="font-size:12px;text-align:center;margin-top:4px">'+(cg.complete?'18 holes in':cg.lastPlayed?'through hole '+cg.lastPlayed:'not started')+(cg.gaps.length?' · <span style="color:var(--amber)">holes '+cg.gaps.join(', ')+' entered out of order — fill the gap</span>':'')+'</div>';
  var tot = roundTotals(g,cr,course,all);
  h += '<div class="ptsline">'+all.map(function(p){ return '<span>'+esc(pname(p))+' <b>'+tot[p].pts+'</b> pts'+(tot[p].holes&&tot[p].holes<18?' <span class="muted">('+tot[p].holes+')</span>':'')+'</span>'; }).join('')+'</div>';
  h += '</div>';
  if (S.ui.mode==='grid') return h + gridHtml(C,r,g,cg,course,all,tot);
  var hole = Math.min(Math.max(S.ui.hole,1),18), H=course.holes[hole-1], e=(g.holes[hole]||{}), gross=e.gross||{};
  var isLD = cr.ldHoles.indexOf(hole)>=0, isCP = cr.cpHoles.indexOf(hole)>=0;
  // values on THIS hole: pots after the last complete hole, +1
  var rec = cg.holes.filter(function(x){return x.hole===hole;})[0];
  var holeVal = rec?rec.holeValue:cg.pots.hole+1, snakeVal = rec?rec.snakeValue:Math.min(cg.pots.snake+1,C.rules.snakeCap);
  var ldVal = rec?rec.ldValue:cg.pots.ld+1, cpVal = rec?rec.cpValue:cg.pots.cp+1;
  var yds = (H.yards||{})[r.tee];
  h += '<div class="card"><div class="holehdr"><div><span class="eyebrow">Hole</span><div class="hn">'+hole+'</div></div><div style="text-align:right"><div style="font-size:15px;font-weight:700">Par '+H.par+' · SI '+H.si+'</div><div class="hm">'+(yds?yds+' yds · ':'')+esc(r.tee)+(isLD?' · <b style="color:var(--blue)">LD hole</b>':'')+(isCP?' · <b style="color:var(--blue)">CP hole</b>':'')+'</div></div></div>';
  h += '<div class="values"><span class="value hole">Hole worth '+frac(holeVal)+'</span><span class="value snake">Snake worth '+frac(snakeVal)+'</span>'+(isLD?'<span class="value ldcp">LD worth '+frac(ldVal)+'</span>':'')+(isCP?'<span class="value ldcp">CP worth '+frac(cpVal)+'</span>':'')+'</div>';
  var bestPts = -1; all.forEach(function(p){ var pts = E.stableford(gross[p],H.par,E.strokesOnHole(cr.hc[p].playing,H.si)); if(pts!==null&&pts>bestPts) bestPts=pts; });
  g.teams.forEach(function(t,ti){
    t.forEach(function(p){
      var st = E.strokesOnHole(cr.hc[p].playing,H.si), gv=gross[p], pts=E.stableford(gv,H.par,st);
      var badge = (typeof gv==='number') ? (gv<=H.par-2?'<span class="autobadge e">'+(gv===1?'ACE':'EAGLE')+'</span>': gv===H.par-1?'<span class="autobadge b">BIRDIE</span>':'') : '';
      h += '<div class="prow"><div class="who"><div class="nm">'+esc(pname(p))+badge+'</div><div class="sub">Team '+(ti+1)+' · hc '+(cr.hc[p].playing===null?'?':cr.hc[p].playing)+' · <span class="dots">'+(st>0?'●'.repeat(st):st<0?'○':'')+'</span>'+(st?' '+st+' stroke'+(st===1||st===-1?'':'s'):' no stroke')+'</div></div>';
      h += '<div class="step"><button data-act="bump" data-h="'+hole+'" data-p="'+p+'" data-d="-1" aria-label="minus">−</button><div class="v'+(gv==='P'?' pk':'')+'" data-act="pickup" data-h="'+hole+'" data-p="'+p+'">'+(gv==='P'?'PICK':(gv||'–'))+'</div><button data-act="bump" data-h="'+hole+'" data-p="'+p+'" data-d="1" aria-label="plus">+</button></div>';
      h += '<div class="pts'+(pts!==null&&pts===bestPts&&bestPts>=0?' best':'')+'"><div class="n">'+(pts===null?'–':pts)+'</div><div class="l">pts</div><div class="rt">'+tot[p].pts+' rd</div></div></div>';
    });
  });
  h += '<div class="muted" style="font-size:11px;margin-top:4px">Tap the number to mark a pick-up (0 points; can\'t win the snake).</div>';
  h += evRow('snake','Snake','furthest first putt, >6 ft, holed',e.snake,all,hole,'amber');
  if (isLD) h += evRow('ld','LD','longest on the fairway',e.ld,all,hole,'blue');
  if (isCP) h += evRow('cp','CP','closest on the green',e.cp,all,hole,'blue');
  h += evRow('ferret','Ferret','holed from off the green, no putter',e.ferret,all,hole,'');
  if (rec && rec.snakeInvalid) h += '<div class="banner bad" style="margin-top:8px">Snake claimed by a player who picked up — not valid.</div>';
  h += '<div class="holenav"><button class="btn" data-act="hole" data-h="'+(hole-1)+'" '+(hole<=1?'disabled':'')+'>'+(hole<=1?'‹ First hole':'‹ Hole '+(hole-1))+'</button><button class="btn primary" data-act="hole" data-h="'+(hole+1)+'" '+(hole>=18?'disabled':'')+'>'+(hole>=18?'Last hole ›':'Hole '+(hole+1)+' ›')+'</button></div>';
  h += '<div class="holechips">'+course.holes.map(function(x){ var ee=g.holes[x.hole]||{}, gg=ee.gross||{}; var n=all.filter(function(p){return E.isEntered(gg[p]);}).length; var cl = x.hole===hole?'cur': n===all.length?'done': n?'part':''; return '<button class="'+cl+'" data-act="hole" data-h="'+x.hole+'">'+x.hole+'</button>'; }).join('')+'</div>';
  return h+'</div>';
}
function evRow(key,label,sub,cur,all,hole,color){
  return '<div class="evrow"><div class="lbl">'+label+'<small>'+sub+'</small></div><div class="chips">'+all.map(function(p){ return '<button class="chip sm '+color+'" aria-pressed="'+(cur===p)+'" data-act="ev" data-k="'+key+'" data-h="'+hole+'" data-p="'+p+'">'+esc(pname(p))+'</button>'; }).join('')+'</div></div>';
}
function ptsOn(H,p,gv,cr){ return E.stableford(gv, H.par, E.strokesOnHole(cr.hc[p].playing, H.si)); }
function roundTotals(g,cr,course,all){ var out={}; all.forEach(function(p){ out[p]={pts:0,gross:0,holes:0}; });
  course.holes.forEach(function(H){ var gr=(g.holes[H.hole]||{}).gross||{}; all.forEach(function(p){ var v=gr[p]; if(!E.isEntered(v)) return; out[p].pts+=ptsOn(H,p,v,cr); out[p].holes++; if(typeof v==='number') out[p].gross+=v; }); });
  return out; }
function gridHtml(C,r,g,cg,course,all,tot){
  var cr=C.rounds[S.ui.r];
  var h='<div class="card"><h2>Grid entry</h2><div class="muted" style="font-size:12px;margin-bottom:6px">Gross strokes per hole; points work themselves out underneath (dots = strokes received). P = pick-up. Snake / LD / CP / ferret: pick the player.</div><div class="tbl"><table class="gridtbl"><thead><tr><th>Hole</th>'+all.map(function(p){return '<th>'+esc(pname(p))+'</th>';}).join('')+'<th>Snake</th><th>LD/CP</th><th>Ferret</th></tr></thead><tbody>';
  course.holes.forEach(function(H){ var e=g.holes[H.hole]||{}, gr=e.gross||{}; var isLD=cr.ldHoles.indexOf(H.hole)>=0, isCP=cr.cpHoles.indexOf(H.hole)>=0;
    h += '<tr><td>'+H.hole+'<span class="muted" style="font-size:10px;display:block">par '+H.par+' · SI '+H.si+'</span>'+(isLD?'<span class="ldcp">LD</span>':'')+(isCP?'<span class="ldcp">CP</span>':'')+'</td>';
    all.forEach(function(p){ var v=gr[p], st=E.strokesOnHole(cr.hc[p].playing,H.si), pts=E.isEntered(v)?ptsOn(H,p,v,cr):null;
      h += '<td><input inputmode="numeric" pattern="[0-9Pp]*" value="'+(v===undefined?'':v)+'" data-act="gcell" data-h="'+H.hole+'" data-p="'+p+'" aria-label="hole '+H.hole+' '+esc(pname(p))+'"><div class="cpts">'+(st?'<span class="dots">'+'●'.repeat(Math.abs(st))+'</span> ':'')+(pts===null?'':pts)+'</div></td>'; });
    h += '<td>'+sel('snake',H.hole,e.snake,all)+'</td><td>'+(isLD?sel('ld',H.hole,e.ld,all):isCP?sel('cp',H.hole,e.cp,all):'<span class="muted">–</span>')+'</td><td>'+sel('ferret',H.hole,e.ferret,all)+'</td></tr>';
  });
  h += '<tr class="tot"><td>Total</td>'+all.map(function(p){ return '<td><div class="num" style="font-size:18px">'+tot[p].pts+'</div><div class="cpts">'+(tot[p].holes?tot[p].gross+' gross':'')+'</div></td>'; }).join('')+'<td colspan="3"></td></tr>';
  return h+'</tbody></table></div></div>';
}
function sel(key,hole,cur,all){ return '<select data-act="gsel" data-k="'+key+'" data-h="'+hole+'"><option value="">–</option>'+all.map(function(p){return '<option value="'+p+'"'+(cur===p?' selected':'')+'>'+esc(pname(p))+'</option>';}).join('')+'</select>'; }

/* ----- Hand in ----- */
function receiveHtml(){
  return '<div class="card"><h2>Receive</h2><p class="muted" style="font-size:14px;margin:0 0 4px"><b>Scorers:</b> get tonight\'s setup (draw, handicaps, carried pots) from the commissioner. <b>Commissioner:</b> take in a scorer\'s card. Scan their QR from inside this app, or paste a link they sent you (AirDrop, iMessage, WhatsApp).</p><div class="btnrow"><button class="btn primary" data-act="scan-open">Scan a QR</button><button class="btn" data-act="paste-open">Paste a link</button></div><div id="paste-box" hidden><textarea class="f" id="paste-txt" placeholder="Paste the link here"></textarea><div class="btnrow"><button class="btn primary" data-act="paste-go">Read it</button></div></div></div>';
}
function handinHtml(C){
  var r=R(), g=G(), rs=T().rounds;

  h += '<div class="chips">'+rs.map(function(x,i){ return '<button class="chip" aria-pressed="'+(i===S.ui.r)+'" data-act="round" data-i="'+i+'">R'+x.n+'</button>'; }).join('')+'</div><div class="chips" style="margin-top:8px">'+r.groups.map(function(x,i){ return '<button class="chip" aria-pressed="'+(i===S.ui.g)+'" data-act="group" data-i="'+i+'">Group '+esc(x.id)+'</button>'; }).join('')+'</div>';

function handinPayload(){ var r=R(), g=G(); return { v:1, kind:'handin', round:r.n, date:r.date, course:r.course, group:g.id, teams:g.teams, holes:g.holes||{}, at:new Date().toISOString(), from:'phone' }; }
var _hiLink='';
function drawQR(){ var box=$('qr'); if(!box) return; box.innerHTML=''; packJSON(handinPayload()).then(function(s){ _hiLink = location.origin+location.pathname+'#hi='+s; $('hi-size').textContent = _hiLink.length+' characters in the link'; try { new QRCode(box, { text:_hiLink, width:236, height:236, correctLevel: QRCode.CorrectLevel.L }); } catch(e){ box.innerHTML='<div class="muted">QR too large — use the link instead.</div>'; } }); }
function incomingHtml(){ var i=S.incoming, T_=T();
  if (i.kind==='handin'){ var ri=T_.rounds.findIndex(function(r){return r.n===i.round;}); var n=Object.keys(i.holes).length; var teams=i.teams.map(function(t){return t.map(pname).join(' & ');}).join(' v ');
    return '<div class="banner good"><b>Card received:</b> Round '+i.round+' · '+esc(i.course)+' · Group '+esc(i.group)+' · '+n+' holes · '+esc(teams)+(ri<0?'<br><b style="color:var(--red)">No Round '+i.round+' on this phone.</b>':'')+'<div class="btnrow"><button class="btn primary sm" data-act="merge" '+(ri<0?'disabled':'')+'>Merge into my copy</button><button class="btn sm" data-act="discard">Discard</button></div></div>'; }
  return '';
}
function mergeIncoming(){ var i=S.incoming, T_=T(); var r=T_.rounds.filter(function(x){return x.n===i.round;})[0]; if(!r) return;
  var g=r.groups.filter(function(x){return x.id===i.group;})[0]; if(!g){ g={id:i.group,teams:i.teams,holes:{}}; r.groups.push(g); }
  var drawn=g.teams.every(function(t){return t.length;}); if(!drawn) g.teams=i.teams;
  g.holes=i.holes; g.handedIn=i.at; S.incoming=null; save(); toast('Merged Group '+i.group+', Round '+i.round); render(); }

  // share + data

  h += '<h3 style="margin-top:4px">Setup for the scorers (tonight)</h3><p class="muted" style="font-size:13px;margin:0 0 6px">Draw, handicaps and carried pots for the next round — small enough to scan at the table. Scorers: Hand in → Scan a QR → Load.</p><div class="btnrow"><button class="btn primary" data-act="share-qr">'+(S.ui.shareQR?'Hide setup QR':'Show setup QR')+'</button><button class="btn" data-act="setup-link">Copy setup link</button></div><div class="qr" id="shareqr" '+(S.ui.shareQR?'':'hidden')+'></div>';

  h += '<div class="card"><h2>Data</h2><div class="btnrow"><button class="btn" data-act="tname">Rename tournament</button><button class="btn danger" data-act="clear-scores">Clear all scores</button><button class="btn danger" data-act="reset-example">Reset to example</button>'+(T().example?'<button class="btn primary" data-act="start-real">Start the real thing</button>':'')+'</div><div class="muted" style="font-size:12px;margin-top:6px">“Start the real thing” keeps players, courses and rounds; wipes example scores and handicaps. Your PIN survives.</div>'

function snapshotPayload(){ var T_=JSON.parse(JSON.stringify(T())); delete T_.courses; return { v:1, kind:'snapshot', at:new Date().toISOString(), T:T_ }; }
// Setup for scorers: same shape, but locked rounds lose their hole data and every group carries its computed pots as an override,
// so the scorer's phone shows the right hole/snake/LD/CP values without needing the whole history. Stays small enough for a QR.
function setupPayload(){ var C=calc(), T_=JSON.parse(JSON.stringify(T())); delete T_.courses; delete T_.example;
  T_.rounds.forEach(function(r,ri){ var cr=C.rounds[ri]; if(!(r.locked&&cr&&cr.complete)) return;
    var rp={}; Object.keys(cr.perPlayer).forEach(function(p){ var x=cr.perPlayer[p]; rp[p]={team:x.team,contrib:x.contrib,ladder:x.ladder,total:x.total,pts:x.pts,played:x.played}; });
    r.frozen={ perPlayer:rp, ladder:cr.ladder, unwon:cr.unwon, ldHoles:cr.ldHoles, cpHoles:cr.cpHoles, slope:cr.slope, rating:cr.rating,
               groups:cr.groups.map(function(g){ return {teamSkins:g.teamSkins, playerShare:g.playerShare, playerPts:g.playerPts, playerContrib:g.playerContrib, unwon:g.unwon, carried:g.carried}; }) };
    r.groups.forEach(function(g){ g.holes={}; delete g.handedIn; }); });
  return { v:1, kind:'snapshot', setup:true, at:new Date().toISOString(), T:T_ }; }
/* commissioner PIN: set once on the master; travels inside the setup, so every phone that loads it needs the PIN for commissioner mode */
function hashPin(pin){ pin=String(pin||'').trim();
  if (window.crypto&&crypto.subtle&&window.isSecureContext) return crypto.subtle.digest('SHA-256', new TextEncoder().encode('mhs:'+pin)).then(function(b){ return 's'+Array.prototype.map.call(new Uint8Array(b),function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); });
  var h=5381; for(var i=0;i<pin.length;i++) h=((h<<5)+h+pin.charCodeAt(i))>>>0; return Promise.resolve('x'+h.toString(16)); }
var _shareLink='';
function drawShareQR(){ var box=$('shareqr'); if(!box) return; box.innerHTML=''; packJSON(setupPayload()).then(function(s){ var link=location.origin+location.pathname+'#view='+s; try { new QRCode(box,{text:link,width:236,height:236,correctLevel:QRCode.CorrectLevel.L}); box.insertAdjacentHTML('beforeend','<div class="muted" style="font-size:11px;width:100%;text-align:center;color:#555">'+link.length+' characters</div>'); } catch(e){ box.innerHTML='<div class="muted">Too much data for a QR — use the setup link.</div>'; } }); }

/* ----- Rules ----- */
function rulesHtml(){
  return '<div class="card rules"><h2>Competition rules</h2>'
  +'<p><b>Stableford team skins.</b> The trophy goes to the single player with the most skins over the week. Teams of two, redrawn every night at dinner. Breakfast ball on the 1st and 10th.</p>'
  +'<h3>Every hole (per group of four)</h3><ul>'
  +'<li><b>Hole skin — 1.</b> Team whose player has the best Stableford on the hole. Tied → carries to the next hole (hole 2 worth 2, and so on).</li>'
  +'<li><b>Snake.</b> Worth 1 on hole 1, then +1 every hole it doesn\'t go off, <b>capped at 9</b>. A snake putt is the group\'s furthest-from-the-pin first putt since reaching the green, more than 6 ft, holed — and the hole must be completed (no pick-up). Sunk → that team takes the value; next hole it\'s worth 1 again.</li>'
  +'<li><b>Birdie — 1.</b> Gross, regardless of handicap.</li>'
  +'<li><b>Eagle — whatever the snake is worth</b> on that hole for that group. Does not reset the snake. Gross.</li>'
  +'<li><b>Ferret — 2.</b> Holed from off the green without a putter.</li>'
  +'<li><b>Longest drive — 1</b> on every par 5 (minimum four; longest par 4s fill in). Must hit the fairway. Nobody does → rolls to the next LD hole.</li>'
  +'<li><b>Closest to pin — 1</b> on every par 3 (minimum four; shortest par 4s fill in). Must hit the green. Nobody does → rolls to the next CP hole.</li>'
  +'<li><b>Hole in one</b> — free drinks for the rest of the trip, plus one entire following trip.</li></ul>'
  +'<h3>End of each day</h3><ul>'
  +'<li>Everything won on the course is the <b>team\'s</b>. Halved between the pair at the end of the day.</li>'
  +'<li>Then the <b>daily Stableford ladder</b>: 7 · 6 · 5 · 4 · 3 · 2 · 1 · 0 skins to the individuals, best score first. Ties split the places.</li>'
  +'<li>Everything unwon — hole skins, snake, LDs, CPs — is pooled across both groups and <b>split evenly between the next day\'s groups</b>. Halves are fine. Each share sits on the first hole of its kind the next day and rolls until it\'s won.</li></ul>'
  +'<h3>Handicaps</h3><p>The commissioner sets each player\'s index for the day (and may adjust aggressively). Playing handicap = index × slope ÷ 113 + (rating − par), rounded — the GA daily handicap. Strokes fall by stroke index. Stableford: net double bogey 0, bogey 1, par 2, birdie 3, eagle 4.</p>'
  +'<h3>Money</h3><p>Entry $150. 1st $1,050 · 2nd $150. Skins left unwon after round 5: to be decided.</p>'
  +'<h3>Scoring</h3><p>One scorer per group each day, on their own phone, live or at the end of the round. Hand in by QR. The commissioner\'s copy is the master and can correct anything before locking the day.</p></div>'
  +'<div class="card rules"><h2>How the week runs</h2>'
  +'<p><b>Two roles.</b> The commissioner\'s phone is the master. Each day two scorers — one per group — score on their own phones. Nothing to set up on a scorer\'s phone: just score your group.</p>'
  +'<h3>Every evening at dinner — commissioner</h3><ol>'
  +'<li>Commish → Round: check tomorrow\'s course and tees.</li>'
  +'<li>Handicaps: copy from the previous round, adjust anyone being nuked.</li>'
  +'<li>Draw: shuffle or set by hand. Read out the teams.</li>'
  +'<li>Share → <b>Show setup QR</b>. Scorers: Hand in → <b>Scan a QR</b> → <b>Load</b>. Their phones now have tomorrow\'s draw, handicaps and carried pots.</li></ol>'
  +'<h3>On the course — scorers</h3><p>Score → your group → hole by hole. No signal needed. Points, hole value and snake value are live. Tap a name for snake / LD / CP / ferret as they happen.</p>'
  +'<h3>At the bar — commissioner</h3><ol>'
  +'<li>Each scorer: Hand in → QR. Commissioner: Hand in → <b>Scan a QR</b> → <b>Merge</b>. Twice.</li>'
  +'<li>Score: glance over both cards, fix anything. Board shows the day\'s skins and ladder.</li>'
  +'<li>Commish → <b>Lock round</b>.</li>'
  +'<li>Share → <b>Copy standings link</b> → group chat.</li></ol>'
  +'<p>Cards only flow scorer → commissioner. Setup only flows commissioner → scorers. If a scorer\'s phone dies, the commissioner types the card off the paper scorecard in Grid view.</p>'
  +'<h3>Who sees what</h3><p>Every phone holds its own copy; nothing on anyone else\'s phone can change the commissioner\'s master. The table everyone sees is the <b>standings link</b> the commissioner posts each night. Anyone who has loaded the setup also sees the totals on their own Board. Commissioner mode is PIN-protected on every phone that has loaded the setup.</p>'
  +'<p class="muted" style="font-size:12px">App version '+esc(APP_VERSION)+'. Updates arrive on their own whenever the app is opened with signal; it reloads itself once.</p></div>';
}

/* ---------- actions ---------- */
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act],[data-tab]'); if(!el) return;
  if (el.dataset.tab){ S.ui.tab=el.dataset.tab; save(); render(); return; }
  var a=el.dataset.act, r=R();
  if (a==='round'){ S.ui.r=+el.dataset.i; S.ui.g=0; S.ui.hole = firstOpenHole(); save(); render(); }
  else if (a==='group'){ S.ui.g=+el.dataset.i; S.ui.hole = firstOpenHole(); save(); render(); }
  else if (a==='mode'){ S.ui.mode = S.ui.mode==='grid'?'live':'grid'; save(); render(); }
  else if (a==='hole'){ S.ui.hole=+el.dataset.h; save(); render(); window.scrollTo(0,0); }
  else if (a==='bump'){ bump(+el.dataset.h, el.dataset.p, +el.dataset.d); }
  else if (a==='pickup'){ togglePickup(+el.dataset.h, el.dataset.p); }
  else if (a==='ev'){ setEvent(+el.dataset.h, el.dataset.k, el.dataset.p); }
  else if (a==='copy-handin'){ copy(_hiLink,'Link copied'); }
  else if (a==='share-handin'){ shareText('Round '+r.n+' Group '+G().id+' card', _hiLink); }
  else if (a==='copy-backup'){ copy(JSON.stringify({v:1,kind:'backup',at:new Date().toISOString(),T:T(),ui:S.ui}),'Backup copied'); }
  else if (a==='restore'){ $('restore-box').hidden=false; }
  else if (a==='restore-go'){ restore($('restore-txt').value); }
  else if (a==='paste-open'){ $('paste-box').hidden=false; $('paste-txt').focus(); }
  else if (a==='paste-go'){ restore($('paste-txt').value); }
  else if (a==='scan-open'){ openScanner(); }
  else if (a==='scan-close'){ if(_scan) _scan.close(); }
  else if (a==='merge'){ mergeIncoming(); }
  else if (a==='discard'){ S.incoming=null; render(); }
  else if (a==='ro-dismiss'){ S.ro=false; load(); S.ui.r=pickRound(); S.ui.hole=firstOpenHole(); render(); }
  else if (a==='ro-load'){ var wasCommish=false; try { var prev=JSON.parse(localStorage.getItem(KEY)||'{}'); wasCommish=!!(prev.ui&&prev.ui.commish); } catch(e){}
    if (confirm((wasCommish?'You are the COMMISSIONER on this phone — loading replaces your master copy. ':'')+'Replace the data on this phone with this snapshot?'+localExtraWarning())) { S.ro=false; S.ui.commish=wasCommish; S.ui.r=pickRound(); S.ui.hole=firstOpenHole(); save(); toast('Loaded'); history.replaceState(null,'',location.pathname); render(); } }
  else if (a==='commish-toggle'){
    if (!el.checked){ S.ui.commish=false; save(); render(); }
    else if (!T().commishHash){ S.ui.commish=true; save(); render(); }
    else { var pin=prompt('Commissioner PIN'); if(pin===null){ render(); return; }
      hashPin(pin).then(function(hh){ if(hh===T().commishHash){ S.ui.commish=true; save(); toast('Commissioner mode on'); } else toast('Wrong PIN'); render(); }); } }
  else if (a==='set-pin'){ var p1=prompt('New commissioner PIN (4+ characters)'); if(!p1||p1.trim().length<4){ toast('PIN not set'); return; } var p2=prompt('Type it again'); if(p1!==p2){ toast('PINs didn\'t match'); return; } hashPin(p1).then(function(hh){ T().commishHash=hh; save(); toast('PIN set'); render(); }); }
  else if (a==='clear-pin'){ if(confirm('Remove the commissioner PIN?')){ delete T().commishHash; save(); render(); } }
  else if (a==='check-update'){ if(!('serviceWorker' in navigator)){ toast('Not installed as an app'); return; } navigator.serviceWorker.getRegistration().then(function(reg){ if(!reg){ toast('No update service'); return; } reg.update().then(function(){ toast('Checked — an update reloads the app by itself'); }).catch(function(){ toast('No signal'); }); }); }
  else if (a==='lock'){ r.locked=!r.locked; save(); render(); }
  else if (a==='shuffle'){ shuffleDraw(); }
  else if (a==='clear-draw'){ r.groups.forEach(function(g){ g.teams=g.teams.map(function(){ return []; }); }); save(); render(); }
  else if (a==='slot'){ var gs=r.groups[+el.dataset.g], ts=gs.teams[+el.dataset.t]; ts.splice(+el.dataset.k,1); gs.teams[+el.dataset.t]=ts.filter(Boolean); save(); render(); }
  else if (a==='pick'){ var placed=false; r.groups.forEach(function(g){ g.teams.forEach(function(t){ if(!placed && t.length<2){ t.push(el.dataset.p); placed=true; } }); }); if(!placed) toast('Every spot is full — clear one first'); save(); render(); }
  else if (a==='copy-draw'){ if(S.ui.r>0){ r.groups=JSON.parse(JSON.stringify(T().rounds[S.ui.r-1].groups)).map(function(g){ g.holes={}; delete g.handedIn; delete g.carriedOverride; return g; }); save(); render(); } }
  else if (a==='copy-index'){ if(S.ui.r>0){ r.index=Object.assign({}, T().rounds[S.ui.r-1].index); save(); render(); } }
  else if (a==='padd'){ var nm=prompt('Player name'); if(nm){ var id='p'+Date.now().toString(36); T().players.push({id:id,name:nm,short:nm.split(' ')[0]}); T().rounds.forEach(function(x){ x.index=x.index||{}; }); save(); render(); } }
  else if (a==='pdel'){ if(confirm('Remove '+pname(el.dataset.p)+'?')){ var id=el.dataset.p; T().players=T().players.filter(function(p){return p.id!==id;}); T().rounds.forEach(function(x){ x.groups.forEach(function(g){ g.teams=g.teams.map(function(t){return t.filter(function(p){return p!==id;});}); }); }); save(); render(); } }
  else if (a==='share-link'){ packJSON(snapshotPayload()).then(function(s){ _shareLink=location.origin+location.pathname+'#view='+s; copy(_shareLink,'Standings link copied ('+_shareLink.length+' chars)'); }); }
  else if (a==='share-native'){ packJSON(snapshotPayload()).then(function(s){ _shareLink=location.origin+location.pathname+'#view='+s; shareText(T().name+' — standings', _shareLink); }); }
  else if (a==='share-qr'){ S.ui.shareQR=!S.ui.shareQR; save(); render(); }
  else if (a==='setup-link'){ packJSON(setupPayload()).then(function(s){ copy(location.origin+location.pathname+'#view='+s,'Setup link copied'); }); }
  else if (a==='tname'){ var n=prompt('Tournament name', T().name); if(n){ T().name=n; save(); render(); } }
  else if (a==='clear-scores'){ if(confirm('Clear every score in every round? Players, draw and handicaps stay.')){ T().rounds.forEach(function(x){ x.locked=false; x.groups.forEach(function(g){ g.holes={}; }); }); save(); render(); } }
  else if (a==='reset-example'){ if(confirm('Replace everything with the example data?')){ var pin2=T().commishHash; S.T=exampleTournament(); if(pin2) S.T.commishHash=pin2; S.ui.r=0; save(); render(); } }
  else if (a==='fresh'){ if(confirm('Wipe everything on this phone and start clean (players, courses and rounds stay)?')){ var pin3=T().commishHash; S.T=emptyTournament(); if(pin3) S.T.commishHash=pin3; S.ui.r=0; save(); toast('Clean'); render(); } }
  else if (a==='start-real'){ if(confirm('Wipe the example scores and handicaps and start the real tournament?')){ var keepPin=T().commishHash, keepName=T().name; S.T=emptyTournament(); if(keepPin) S.T.commishHash=keepPin; if(keepName&&keepName!=='Mission Hills 2026') S.T.name=keepName; S.ui.r=0; S.ui.commish=true; save(); toast('Ready — set the draw and handicaps'); render(); } }
});
document.addEventListener('change', function(ev){
  var el=ev.target.closest('[data-act]'); if(!el) return; var a=el.dataset.act, r=R();
  if (a==='gcell'){ var v=el.value.trim().toUpperCase(); var g=G(); if(!canEdit(r)) return; var e=ensureHole(g,+el.dataset.h); if(v==='') delete e.gross[el.dataset.p]; else if(v==='P') e.gross[el.dataset.p]='P'; else if(/^\d+$/.test(v)&&+v>0) e.gross[el.dataset.p]=+v; save(); render(); }
  else if (a==='gsel'){ var g2=G(); if(!canEdit(r)) return; var e2=ensureHole(g2,+el.dataset.h); if(el.value) e2[el.dataset.k]=el.value; else delete e2[el.dataset.k]; save(); render(); }
  else if (a==='rfield'){ var k=el.dataset.k, v2=el.value;
    if (k==='ldHoles'||k==='cpHoles'){ r[k]=v2.split(/[,\s]+/).map(Number).filter(function(n){return n>=1&&n<=18;}); }
    else if (k==='slopeOverride'||k==='ratingOverride'){ r[k]= v2===''?null:+v2; }
    else if (k==='course'){ r.course=v2; var c=courseOf(r); if(!c.tees.some(function(t){return t.name===r.tee;})) r.tee=c.tees[0].name; r.ldHoles=[]; r.cpHoles=[]; }
    else r[k]=v2; save(); render(); }
  else if (a==='index'){ r.index=r.index||{}; if(el.value==='') delete r.index[el.dataset.p]; else r.index[el.dataset.p]=+el.value; save(); render(); }
  else if (a==='hcov'){ r.hcOverride=r.hcOverride||{}; if(el.value==='') delete r.hcOverride[el.dataset.p]; else r.hcOverride[el.dataset.p]=+el.value; save(); render(); }
  else if (a==='carry'){ var g3=r.groups[+el.dataset.g]; g3.carriedOverride=g3.carriedOverride||{}; if(el.value==='') delete g3.carriedOverride[el.dataset.k]; else g3.carriedOverride[el.dataset.k]=+el.value; save(); render(); }
  else if (a==='pname'){ pl(el.dataset.p).name=el.value; save(); render(); }
  else if (a==='pshort'){ pl(el.dataset.p).short=el.value; save(); render(); }
});
function firstOpenHole(){ var g=G(); if(!g) return 1; var all=[].concat.apply([],g.teams); for(var h=1;h<=18;h++){ var gr=(g.holes[h]||{}).gross||{}; if(!all.every(function(p){return E.isEntered(gr[p]);})) return h; } return 18; }
function shuffleDraw(){ var r=R(), ids=T().players.map(function(p){return p.id;}); for(var i=ids.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=ids[i]; ids[i]=ids[j]; ids[j]=t; }
  var per=Math.ceil(ids.length/r.groups.length); r.groups.forEach(function(g,gi){ var chunk=ids.slice(gi*per,(gi+1)*per); var half=Math.ceil(chunk.length/2); g.teams=[chunk.slice(0,half), chunk.slice(half)]; }); save(); render(); }
function localExtraWarning(){ try { var raw=localStorage.getItem(KEY); if(!raw) return ''; var o=JSON.parse(raw); var n=0; o.T.rounds.forEach(function(r){ r.groups.forEach(function(g){ Object.keys(g.holes||{}).forEach(function(h){ if(Object.keys((g.holes[h]||{}).gross||{}).length) n++; }); }); }); return n?'\n\nThis phone has '+n+' scored holes. If any haven\'t been handed in yet, hand them in first.':''; } catch(e){ return ''; } }
/* in-app QR scanner: keeps the hand-in inside this app's own storage (iPhone home-screen apps don't share storage with Safari) */
var _scan=null;
function openScanner(){
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)||!window.jsQR){ toast('Camera not available here — paste the link instead'); return; }
  var wrap=document.createElement('div'); wrap.className='scan';
  wrap.innerHTML='<div class="scan-in"><video playsinline autoplay muted></video><canvas hidden></canvas><div class="scan-msg">Point at the QR on the other phone</div><button type="button" class="btn block" data-act="scan-close">Cancel</button></div>';
  document.body.appendChild(wrap);
  var video=wrap.querySelector('video'), canvas=wrap.querySelector('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true}), stream=null, raf=0, done=false;
  _scan={ close:function(){ done=true; cancelAnimationFrame(raf); if(stream) stream.getTracks().forEach(function(t){ t.stop(); }); wrap.remove(); _scan=null; } };
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}).then(function(s){ stream=s; video.srcObject=s; var p=video.play(); if(p&&p.catch) p.catch(function(){}); tick(); })
    .catch(function(){ toast('Camera blocked — paste the link instead'); if(_scan) _scan.close(); });
  function tick(){
    if(done) return;
    if(video.readyState>=2 && video.videoWidth){
      canvas.width=video.videoWidth; canvas.height=video.videoHeight; ctx.drawImage(video,0,0);
      var img=ctx.getImageData(0,0,canvas.width,canvas.height);
      var code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
      if(code&&code.data){ var m=/#(hi|view)=([A-Za-z0-9_\-]+)/.exec(code.data);
        if(m){ _scan.close(); unpackJSON(m[2]).then(function(o){ applyIncoming(o,m[1]); toast('Card read'); }).catch(function(){ toast('Could not read that QR'); }); return; } }
    }
    raf=requestAnimationFrame(tick);
  }
}
function copy(text,msg){ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){toast(msg);},function(){fallbackCopy(text,msg);}); else fallbackCopy(text,msg); }
function fallbackCopy(text,msg){ var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(msg);}catch(e){ prompt('Copy this:',text);} document.body.removeChild(ta); }
function shareText(title,url){ if(navigator.share) navigator.share({title:title,url:url}).catch(function(){}); else copy(url,'Link copied'); }
function restore(txt){ txt=(txt||'').trim(); if(!txt) return; var m=/#(hi|view)=([A-Za-z0-9_\-]+)/.exec(txt); if(m){ unpackJSON(m[2]).then(function(o){ applyIncoming(o, m[1]); }).catch(function(){ toast('Could not read that link'); }); return; }
  try { var o=JSON.parse(txt); if(o&&o.T&&o.T.rounds){ if(confirm('Restore this backup? Replaces everything on this phone.')){ S.T=o.T; S.T.courses=S.T.courses||COURSES; S.ui=Object.assign(S.ui,o.ui||{}); save(); toast('Restored'); render(); } } else toast('Not a backup'); } catch(e){ toast('Not a backup'); } }

/* ---------- pack / unpack (deflate + base64url) ---------- */
function b64u(bytes){ var s=''; for(var i=0;i<bytes.length;i++) s+=String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function ub64u(str){ str=str.replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; var bin=atob(str), out=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
function packJSON(obj){ var bytes=new TextEncoder().encode(JSON.stringify(obj));
  if (!window.CompressionStream) return Promise.resolve('r'+b64u(bytes));
  var cs=new CompressionStream('deflate-raw'); var w=cs.writable.getWriter(); w.write(bytes); w.close();
  return new Response(cs.readable).arrayBuffer().then(function(buf){ return 'z'+b64u(new Uint8Array(buf)); }); }
function unpackJSON(str){ var t=str[0], data=ub64u(str.slice(1));
  if (t==='r') return Promise.resolve(JSON.parse(new TextDecoder().decode(data)));
  if (!window.DecompressionStream) return Promise.reject(new Error('no inflate'));
  var ds=new DecompressionStream('deflate-raw'); var w=ds.writable.getWriter(); w.write(data); w.close();
  return new Response(ds.readable).arrayBuffer().then(function(buf){ return JSON.parse(new TextDecoder().decode(new Uint8Array(buf))); }); }
function applyIncoming(o, kind){
  if (o.kind==='handin'){ S.incoming=o; S.ui.tab='handin'; render(); }
  else if (o.kind==='snapshot'){ S.ro=true; S.roSetup=!!o.setup; S.roAt=new Date(o.at).toLocaleString(); S.T=o.T; S.T.courses=COURSES; S.ui.tab=o.setup?'score':'board'; S.ui.r=pickRound(); S.ui.hole=1; render(); }
}

/* ---------- boot ---------- */
load();
S.ui.r = Math.min(S.ui.r, T().rounds.length-1); if (S.ui.r<0) S.ui.r=0;
if (!localStorage.getItem(KEY)) S.ui.r = pickRound();
S.ui.hole = firstOpenHole();
var tabm=/^#tab=(board|score|handin|commish|rules)(?::(grid|live|qr))?(?::r(\d))?(?::g(\d))?(?::h(\d+))?(?::(c))?$/.exec(location.hash||'');
if (tabm){ S.ui.tab=tabm[1]; if(tabm[1]==='commish'||tabm[6]) S.ui.commish=true; if(tabm[2]==='qr') S.ui.shareQR=true; else if(tabm[2]) S.ui.mode=tabm[2];
  if(tabm[3]) S.ui.r=Math.max(0,+tabm[3]-1); if(tabm[4]) S.ui.g=Math.max(0,+tabm[4]-1); if(tabm[5]) S.ui.hole=+tabm[5]; history.replaceState(null,'',location.pathname); }
var m=/^#(hi|view)=([A-Za-z0-9_\-]+)$/.exec(location.hash||'');
if (m){ unpackJSON(m[2]).then(function(o){ applyIncoming(o,m[1]); history.replaceState(null,'',location.pathname); }).catch(function(){ toast('Could not read that link'); render(); }); }
else render();
if ('serviceWorker' in navigator && location.protocol.indexOf('http')===0) {
  var hadController = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.register('sw.js').then(function(reg){ reg.update().catch(function(){}); }).catch(function(){});
  // a new version has taken over: reload once so this page runs it (state lives in localStorage, nothing is lost)
  navigator.serviceWorker.addEventListener('controllerchange', function(){ if (reloaded || !hadController) return; reloaded = true; location.reload(); });
}
})();
